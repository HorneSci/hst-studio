[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hstcore"
version = "0.1.0"
description = "Python bindings for the HST-core Embedded ABI (libhstcore). Requires a licensed library, sold separately."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "HorneSci" }]
keywords = ["ctypes", "bindings", "ffi", "sparse", "delta", "hstcore"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "mypy>=1.5"]

# [project.urls] deliberately omitted until the public home is decided.
# It pointed at github.com/HorneSci/<pkg>, which does not exist publicly --
# shipping a Homepage that 404s is worse than shipping none. Restore both
# when the repo is live.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hstcore = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
